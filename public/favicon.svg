<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Round brilliant in profile at real grading proportions: table 56%,
       crown 14.5%, girdle 3%, pavilion 43.1%. The cut, not the carat. -->
  <g fill="none" stroke="#eef9fd" stroke-width="5" stroke-linejoin="round">
    <!-- crown: table edge down to girdle -->
    <path d="M28 38 H72 L86 52 H14 Z" />
    <!-- pavilion: girdle down to culet -->
    <path d="M14 52 L50 92 L86 52" />
  </g>
  <!-- crown facet junctions -->
  <g stroke="#eef9fd" stroke-width="3" opacity="0.55">
    <path d="M28 38 L14 52 M72 38 L86 52 M50 38 V52" />
  </g>
</svg>
